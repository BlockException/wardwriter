name: Release Desktop App

# Runs whenever a version tag (e.g. v1.0.0) is pushed. Builds the web bundle,
# packages it with Tauri, and attaches the installers to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --bundles pinned explicitly so each platform always produces exactly
          # two installers (Windows: msi+nsis, Linux: deb+appimage), independent
          # of whether optional tools like rpmbuild are present on the runner.
          - platform: 'windows-latest'
            args: '--bundles msi,nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          # To enable macOS builds later, uncomment the entry below.
          # - platform: 'macos-latest'
          #   args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WardWriter ${{ github.ref_name }}'
          releaseBody: 'Automatischer Release der WardWriter Desktop-App.'
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: 'wardwriter_[platform]_[arch][_setup].[ext]'
          args: ${{ matrix.args }}
